plugins { id 'com.android.application' }
android {
    namespace 'de.klarlernen.app'
    compileSdk 36
    defaultConfig { applicationId 'de.klarlernen.app'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2.0'; testInstrumentationRunner 'de.klarlernen.app.FlowInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    sourceSets { test.resources.srcDirs = ['src/main/assets'] }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

